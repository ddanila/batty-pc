name: parity-check

on:
  push:
    branches: ["**"]
  pull_request:

# CI scope decision (calibrated against run 27697521157):
# Hosted GitHub runners have no KVM, so QEMU runs under TCG emulation that is
# SLOWER than real time. The gate harness waits for game frames with
# wall-clock sleeps (boot-wait + delta/fps), which assume ~real-time frame
# execution — under TCG the port hasn't finished N frames when the capture
# fires, so the probe lands on the wrong frame and EVERY QEMU gate "diverges"
# (observed: bat-deflection 14/14, laffc-ball 5/5, ... over a 21-min job).
# A bigger BATTY_BOOT_WAIT does NOT fix this — it would need a
# frame-completion-aware harness (poll until the port reports it reached
# frame N) or a KVM/self-hosted runner. So hosted CI runs only the fast,
# deterministic, emulator-free signal; the full QEMU suite runs locally via
# `make parity-check-parallel` (and the ZEsarUX-oracle gates via
# `make parity-check-full`).
jobs:
  build-and-source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the DOS test EXE (compile check, in-tree linux-amd64 OpenWatcom)
        run: make build/batty-test.exe
      - name: Source-level regression gates (no emulator)
        run: |
          make test-l3-replay-seed
          make test-death-sparks
          make test-rocket-bonus
