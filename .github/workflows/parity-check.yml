name: parity-check

on:
  push:
    branches: ["**"]
  pull_request:

# CI runs the fast, deterministic, emulator-free signal: the DOS port
# compiles (in-tree linux-amd64 OpenWatcom) and the source-level regression
# gates pass. That's quick and reliable on hosted runners.
#
# The QEMU gates are NOT run in CI. Calibration (runs 27697521157 /
# 27705593245) showed hosted GitHub runners could not run them reliably.
#
# CAVEAT, measured 2026-08-10: that calibration's premise is now WRONG.
# The probe step below reports `/dev/kvm` PRESENT on ubuntu-latest, so
# "no KVM -> TCG emulation" no longer describes these runners. The
# timings below were taken under TCG and stand only for TCG. Re-measure
# with `-accel kvm` before treating any of it as current. What follows
# is why the job was dropped, not why it must stay dropped: first the wall-clock frame waits made every gate diverge
# (now fixed by the BATTY_SERIAL_PROBE COM1 frame-completion signal, which is
# frame-exact at any speed), but on TCG the boots are so slow that even a
# 2-gate smoke takes ~9 min and still flaked on probe capture. A practical
# QEMU CI gate needs a KVM-enabled / self-hosted runner. Until then the full
# QEMU suite runs LOCALLY (`make parity-check-parallel`, fully green), and the
# ZEsarUX-oracle gates via `make parity-check-full`.
#
# The last step below PROBES for KVM rather than assuming. That conclusion
# was reached before GitHub enabled nested virtualization on Linux runners
# (2024) and has never been re-measured; a step that prints the answer on
# every run costs nothing and settles PLAN.md WS8.1 with evidence.

# One job on purpose: every step is seconds, and splitting them would pay
# a fresh checkout and toolchain setup per step for no parallelism worth
# having.
jobs:
  build-and-source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the disassembly submodule (only that one)
        # `make test-fast` runs source gates that read the CityAceE
        # disassembly: test-kinnock parses its expected text straight out
        # of txt/txt_kinnock.asm rather than copying it, and
        # check_frame_derivable / check_sound_ids / notes_symbols read it
        # too. actions/checkout does not fetch submodules by default, so
        # those gates could not have passed here — they simply were not
        # reached until CI started running the whole suite.
        #
        # Named explicitly rather than `submodules: true` on the checkout:
        # the other submodule is tools/zesarux, the emulator's full source
        # tree, and CI does not run the ZEsarUX-oracle gates. --depth 1
        # because no gate reads its history.
        run: git submodule update --init --depth 1 original/disasm
      - name: Build the DOS test EXE (compile check, in-tree linux-amd64 OpenWatcom)
        run: make build/batty-test.exe
      - name: Host tests and source gates (no emulator)
        # `make test-fast` IS the list: 14 host suites plus every source
        # gate, in seconds. This step used to name test-video and three
        # gates by hand, so CI ran 1 of 14 suites and 3 of 10 gates while
        # looking complete. Naming targets here made this a THIRD copy of
        # a list that had already drifted twice between test-fast and
        # parity-check; delegating means there is one list, and
        # check_host_tests_wired.py guards it.
        #
        # Everything it needs is in the repo or degrades cleanly:
        # assets/random_seed.bin builds from the tracked tape data, and
        # test_bricks skips its golden half when build/level_gt/*.scr is
        # absent (as it is here) rather than failing.
        run: make test-fast
      - name: Host suites under ASan + UBSan (no emulator)
        # Added 2026-08-10. Host-only and ~7s, so it belongs in CI even
        # though the QEMU gates cannot be. It found a real out-of-bounds
        # read in replay_parse_hex_bytes on its first local run, and it
        # catches two mutants that no ordinary host build can observe
        # (writes past a static array that nothing inside the program
        # reads back).
        #
        # This is also the first time the suites are built by a compiler
        # that is not Apple clang: `c++` here is g++, and the two
        # sanitiser implementations do not flag identical sets. If this
        # step ever fails alone, read it as a finding, not as flakiness.
        run: make test-asan
      - name: Does this runner have KVM? (diagnostic, never fails)
        # PLAN.md WS8.1 asks exactly this and has never been measured.
        # The QEMU job was dropped because hosted runners fall back to
        # TCG, where a 2-gate smoke took ~9 min and still flaked; the
        # note there says the conclusion predates GitHub enabling nested
        # virtualization on Linux runners in 2024. So: look, record the
        # answer in the log, and decide with evidence.
        #
        # `|| true` on every line — this step reports, it does not gate.
        run: |
          echo "== /dev/kvm =="
          ls -l /dev/kvm 2>&1 || true
          echo "== egrep vmx/svm in cpuinfo =="
          grep -c -E '(vmx|svm)' /proc/cpuinfo 2>&1 || true
          echo "== kvm-ok, if present =="
          command -v kvm-ok >/dev/null && kvm-ok 2>&1 || echo "kvm-ok not installed"
          echo "== qemu accelerators =="
          command -v qemu-system-i386 >/dev/null \
            && qemu-system-i386 -accel help 2>&1 \
            || echo "qemu-system-i386 not installed on this image"
