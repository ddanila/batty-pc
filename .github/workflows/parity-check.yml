name: parity-check

on:
  push:
    branches: ["**"]
  pull_request:

# CI runs the fast, deterministic, emulator-free signal: the DOS port
# compiles (in-tree linux-amd64 OpenWatcom) and the source-level regression
# gates pass. That's quick and reliable on hosted runners.
#
# The QEMU gates are NOT run in CI. Calibration (runs 27697521157 /
# 27705593245) showed hosted GitHub runners (no KVM -> TCG emulation) can't
# run them reliably: first the wall-clock frame waits made every gate diverge
# (now fixed by the BATTY_SERIAL_PROBE COM1 frame-completion signal, which is
# frame-exact at any speed), but on TCG the boots are so slow that even a
# 2-gate smoke takes ~9 min and still flaked on probe capture. A practical
# QEMU CI gate needs a KVM-enabled / self-hosted runner. Until then the full
# QEMU suite runs LOCALLY (`make parity-check-parallel`, fully green), and the
# ZEsarUX-oracle gates via `make parity-check-full`.
jobs:
  build-and-source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the DOS test EXE (compile check, in-tree linux-amd64 OpenWatcom)
        run: make build/batty-test.exe
      - name: Host tests and source gates (no emulator)
        # `make test-fast` IS the list: 14 host suites plus every source
        # gate, in seconds. This step used to name test-video and three
        # gates by hand, so CI ran 1 of 14 suites and 3 of 10 gates while
        # looking complete. Naming targets here made this a THIRD copy of
        # a list that had already drifted twice between test-fast and
        # parity-check; delegating means there is one list, and
        # check_host_tests_wired.py guards it.
        #
        # Everything it needs is in the repo or degrades cleanly:
        # assets/random_seed.bin builds from the tracked tape data, and
        # test_bricks skips its golden half when build/level_gt/*.scr is
        # absent (as it is here) rather than failing.
        run: make test-fast
